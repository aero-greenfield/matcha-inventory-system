# ============================================================
# Botaniks Test Suite (CI)
# ============================================================

# WHAT THIS FILE IS:
# GitHub Actions workflow. GitHub runs it automatically on every push and
# pull request to the branches listed below.

# WHAT IT DOES:
# 1. Spins up a temporary Ubuntu VM on GitHub's servers.
# 2. Installs Python + the pinned dependencies from requirements.txt.
# 3. Runs the pytest suite (test_scripts/) against an isolated throwaway SQLite DB.
# 4. If any test fails, the run is marked failed (red X on the commit/PR) so a
#    broken change is caught BEFORE it deploys.

# NOTE: tests run on SQLite (no secrets needed — conftest.py sets the env vars and
# points the DB at a temp SQLite file). This does NOT touch production data.

name: Tests

on:
  push:
    branches: [units-conversion-layer, main]
  pull_request:
    branches: [units-conversion-layer, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest test_scripts -q
