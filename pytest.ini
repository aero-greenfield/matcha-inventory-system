[pytest]
# The pytest suite lives in test_scripts/ and runs against an isolated throwaway SQLite DB
# created per session (see test_scripts/conftest.py). It never touches data/inventory.db.
testpaths = test_scripts
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
